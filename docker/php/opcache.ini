; Production OPcache tuning (laravel-advanced §6).
; PHP 8.5 ships OPcache always-compiled; it still must be enabled + tuned.
; Mounted into the Octane/FrankenPHP prod image — NOT used by the local Sail
; dev stack (kept here so infra-as-code mirrors omnibus-cms).
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.jit=tracing
opcache.jit_buffer_size=128M
